<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外勞支援申請</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --green: #2E7D32; --green-bg: #e8f3e6; --text: #222; --sub: #777;
    --line: #e4e4e4; --bg: #f5f6f4; --card: #fff; --red: #C62828; --orange: #EF6C00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 90px; }
  header { background: var(--green); color: #fff; padding: 16px; }
  header h1 { margin: 0; font-size: 18px; }
  header .who { font-size: 13px; opacity: .85; margin-top: 2px; }
  .tabs { display: flex; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .tabs button { flex: 1; border: 0; background: none; padding: 13px 0; font-size: 15px; color: var(--sub); border-bottom: 3px solid transparent; }
  .tabs button.on { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 12px; line-height: 18px; margin-left: 4px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-top: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  label { display: block; font-size: 13px; color: var(--sub); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input, select, textarea { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-family: inherit; }
  textarea { min-height: 84px; resize: vertical; }
  .row2 { display: flex; gap: 10px; } .row2 > div { flex: 1; }
  .total { margin-top: 12px; padding: 10px 12px; background: var(--green-bg); border-radius: 8px; font-size: 14px; }
  .total b { color: var(--green); font-size: 17px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 10px; padding: 13px; font-size: 16px; font-weight: 600; margin-top: 16px; color: #fff; background: var(--green); }
  .btn.red { background: var(--red); } .btn.gray { background: #9e9e9e; } .btn.outline { background: #fff; color: var(--green); border: 1px solid var(--green); }
  .btn:disabled { opacity: .5; }
  .btns { display: flex; gap: 10px; } .btns .btn { flex: 1; }
  .item { display: block; background: #fff; border-radius: 12px; padding: 14px 16px; margin-top: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .item .top { display: flex; justify-content: space-between; align-items: center; }
  .item .id { font-size: 12px; color: var(--sub); }
  .item .main { margin-top: 6px; font-weight: 600; }
  .item .meta { margin-top: 4px; font-size: 13px; color: var(--sub); }
  .st { font-size: 12px; padding: 2px 9px; border-radius: 10px; color: #fff; white-space: nowrap; }
  .st-待核准 { background: #EF6C00; } .st-已核准 { background: #1565C0; } .st-待檢核 { background: #6A1B9A; }
  .st-已結案 { background: #2E7D32; } .st-已退回 { background: #C62828; } .st-已取消 { background: #9e9e9e; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  .center { text-align: center; padding: 80px 20px; color: var(--sub); }
  dl { margin: 0; display: grid; grid-template-columns: 92px 1fr; row-gap: 8px; font-size: 14px; }
  dt { color: var(--sub); } dd { margin: 0; word-break: break-word; white-space: pre-wrap; }
  h3 { margin: 0 0 12px; font-size: 16px; }
  .note { background: #fff4e5; border-left: 4px solid var(--orange); padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-top: 12px; }
  .sheet { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 20; }
  .sheet .bar { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 12px; z-index: 2; }
  .sheet .bar button { border: 0; background: none; font-size: 22px; color: var(--green); padding: 0 4px; }
  .thumbs { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .thumbs img { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; }
  .busy { position: fixed; inset: 0; background: rgba(255,255,255,.6); display: flex; align-items: center; justify-content: center; z-index: 50; font-size: 15px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: rgba(0,0,0,.82); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; z-index: 60; max-width: 90%; text-align: center; }
  a { color: #1565C0; }
  .checks { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
  label.chk { display: flex; align-items: flex-start; gap: 10px; margin: 0; padding: 12px; color: var(--text); font-size: 15px; border-top: 1px solid #eee; }
  label.chk:first-child { border-top: 0; }
  label.chk input { width: 22px; height: 22px; flex: none; margin: 0; accent-color: var(--green); }
</style>
</head>
<body>
<div id="app"><div class="center">載入中…</div></div>

<script>
/* ====== 部署前請填入 ====== */
const LIFF_ID = '請填入 LIFF ID';
const API_URL = '請填入 Apps Script 網頁應用程式網址（結尾為 /exec）';
/* ========================= */

let D = null;          // initData
let tab = 'apply';
let photos = [];       // 回報照片 dataURL

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(action, payload = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, payload, idToken: liff.getIDToken() }),
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.msg || '發生錯誤');
  return j.data;
}

function busy(on, text = '處理中…') {
  let el = $('#busy');
  if (on && !el) { el = document.createElement('div'); el.id = 'busy'; el.className = 'busy'; el.textContent = text; document.body.appendChild(el); }
  if (!on && el) el.remove();
}
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}
async function run(fn, text) {
  busy(true, text);
  try { return await fn(); } catch (e) { toast(e.message); } finally { busy(false); }
}

/* ====== 啟動 ====== */
(async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    await reload();
    const id = new URLSearchParams(location.search).get('id');
    if (id && D && D.active) openDetail(id);
  } catch (e) {
    $('#app').innerHTML = `<div class="center">無法載入：${esc(e.message)}<br><br>請關閉後從 LINE 重新開啟</div>`;
  }
})();

async function reload() {
  D = await api('init');
  render();
}

function render() {
  if (!D.registered) return renderRegister();
  if (!D.active) {
    $('#app').innerHTML = `<header><h1>外勞支援申請</h1></header>
      <div class="center">已送出註冊，<br>請等待主管啟用帳號後再開啟。</div>`;
    return;
  }
  const todoN = (D.todo || []).length;
  $('#app').innerHTML = `
    <header><h1>外勞支援申請</h1><div class="who">${esc(D.me.name)}・${esc(D.me.dept)}${D.me.isMgr ? '・主管' : ''}</div></header>
    <div class="tabs">
      <button data-t="apply" class="${tab === 'apply' ? 'on' : ''}">申請</button>
      <button data-t="mine" class="${tab === 'mine' ? 'on' : ''}">我的紀錄</button>
      ${D.me.isMgr ? `<button data-t="todo" class="${tab === 'todo' ? 'on' : ''}">待辦${todoN ? `<span class="badge">${todoN}</span>` : ''}</button>` : ''}
    </div>
    <div class="wrap" id="body"></div>`;
  document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => { tab = b.dataset.t; render(); });
  if (tab === 'apply') renderApply();
  else if (tab === 'mine') renderList(D.mine, '還沒有申請紀錄');
  else renderList(D.todo || [], '目前沒有待處理的單 👍');
}

/* ====== 註冊 ====== */
function renderRegister() {
  $('#app').innerHTML = `
    <header><h1>外勞支援申請</h1><div class="who">第一次使用，請先註冊</div></header>
    <div class="wrap"><div class="card">
      <label>姓名</label><input id="rName" placeholder="請輸入真實姓名">
      <label>部門</label><select id="rDept">${D.depts.map((d) => `<option>${esc(d)}</option>`).join('')}</select>
      <button class="btn" id="rGo">送出註冊</button>
    </div></div>`;
  $('#rGo').onclick = () => run(async () => {
    await api('register', { name: $('#rName').value, dept: $('#rDept').value });
    await reload();
  }, '送出中…');
}

/* ====== 申請 ====== */
function renderApply() {
  const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  $('#body').innerHTML = `<div class="card">
    <label>需求日期</label><input type="date" id="aDate" value="${today}" min="${today}">
    <label>工作項目</label><select id="aItem">${D.items.map((x) => `<option>${esc(x)}</option>`).join('')}</select>
    <div id="aOtherWrap" style="display:none">
      <input id="aOther" list="aOtherList" maxlength="30" placeholder="輸入今天的工作項目，例：蛹分離" style="margin-top:8px">
      <datalist id="aOtherList">${(D.recentOthers || []).map((x) => `<option value="${esc(x)}">`).join('')}</datalist>
      <div style="font-size:12px;color:var(--sub);margin-top:4px">之前有人填過的會出現在建議裡，同一種工作盡量用同一個名稱</div>
    </div>
    <div class="row2">
      <div><label>需要人數</label><input type="number" id="aPeople" value="1" min="1" max="50" inputmode="numeric"></div>
      <div><label>每人時數</label><input type="number" id="aHours" value="4" min="0.5" max="12" step="0.5" inputmode="decimal"></div>
    </div>
    <div class="total">預估總工時：<b id="aTotal">4</b> 小時</div>
    <label>工作說明</label><textarea id="aDesc" placeholder="例：A 棟幼蟲盤清洗，約 120 盤"></textarea>
    <label>預計完成事項（每行一項，完成後要逐項勾選確認）</label>
    <textarea id="aTasks" placeholder="例：&#10;清洗幼蟲盤 120 盤&#10;更換飼養箱墊料&#10;清運廢棄物至集中區"></textarea>
    <button class="btn" id="aGo">送出申請</button>
  </div>`;
  const calc = () => { $('#aTotal').textContent = Math.round((+$('#aPeople').value || 0) * (+$('#aHours').value || 0) * 10) / 10; };
  $('#aPeople').oninput = calc; $('#aHours').oninput = calc;
  const OTHER = D.items[D.items.length - 1];
  $('#aItem').onchange = () => {
    const on = $('#aItem').value === OTHER;
    $('#aOtherWrap').style.display = on ? 'block' : 'none';
    if (on) $('#aOther').focus();
  };
  $('#aGo').onclick = () => run(async () => {
    const r = await api('apply', {
      date: $('#aDate').value, item: $('#aItem').value, itemOther: $('#aOther').value,
      people: +$('#aPeople').value, hours: +$('#aHours').value, desc: $('#aDesc').value,
      tasks: $('#aTasks').value.split('\n').map((t) => t.trim()).filter(Boolean),
    });
    toast('已送出，單號 ' + r.id);
    tab = 'mine'; await reload();
  }, '送出中…');
}

/* ====== 列表 ====== */
function renderList(list, emptyText) {
  if (!list.length) { $('#body').innerHTML = `<div class="empty">${emptyText}</div>`; return; }
  $('#body').innerHTML = list.map((r) => `
    <a class="item" data-id="${esc(r.id)}" style="text-decoration:none;color:inherit">
      <div class="top"><span class="id">${esc(r.id)}</span><span class="st st-${esc(r.status)}">${esc(r.status)}</span></div>
      <div class="main">${esc(r.item)}・${esc(r.date)}</div>
      <div class="meta">${tab === 'todo' ? esc(r.name) + '・' : ''}預估 ${esc(r.estTotal)} 小時${r.actTotal !== '' ? `・實際 ${esc(r.actTotal)} 小時` : ''}</div>
    </a>`).join('');
  document.querySelectorAll('.item').forEach((a) => a.onclick = () => openDetail(a.dataset.id));
}

/* ====== 單筆明細與操作 ====== */
async function openDetail(id) {
  let r = [...(D.mine || []), ...(D.todo || [])].find((x) => x.id === id);
  if (!r) r = await run(() => api('get', { id }), '載入中…');
  if (!r) return;
  photos = [];
  const mine = r.uid === D.me.uid;
  const mgr = D.me.isMgr;
  const tasks = String(r.tasks || '').split('\n').map((t) => t.trim()).filter(Boolean);
  const prevCheck = String(r.taskCheck || '').split('\n');
  const photoLinks = r.photos ? String(r.photos).split('\n').map((u, i) => `<a href="${esc(u)}" target="_blank">照片${i + 1}</a>`).join('　') : '';

  let action = '';
  if (mine && r.status === '待核准') {
    action = `<button class="btn gray" id="xCancel">取消申請</button>`;
  }
  if (mine && r.status === '已核准') {
    action = `<div class="card"><h3>完成回報</h3>
      ${r.checkResult === '退回補件' ? `<div class="note" style="margin:0 0 4px">主管要求補件：${esc(r.checkNote)}</div>` : ''}
      <div class="row2">
        <div><label>實際人數</label><input type="number" id="pPeople" value="${esc(r.actPeople !== '' ? r.actPeople : r.people)}" min="0" max="50" inputmode="numeric"></div>
        <div><label>實際每人時數</label><input type="number" id="pHours" value="${esc(r.actHours !== '' ? r.actHours : r.hours)}" min="0" max="12" step="0.5" inputmode="decimal"></div>
      </div>
      <div class="total">實際總工時：<b id="pTotal"></b> 小時（預估 ${esc(r.estTotal)}）</div>
      ${tasks.length ? `<label>確認已完成事項</label>
        <div class="checks">${tasks.map((t, i) => `<label class="chk"><input type="checkbox" class="pChk" data-i="${i}" ${String(prevCheck[i] || '').indexOf('✅') === 0 ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div>
        <div class="meta" id="pChkSum" style="font-size:13px;color:var(--sub);margin-top:4px"></div>` : ''}
      <label>完成狀態</label><select id="pDone">${D.doneOptions.map((x) => `<option>${x}</option>`).join('')}</select>
      <label>說明（部分完成／未完成必填）</label><textarea id="pNote">${esc(r.doneNote)}</textarea>
      <label>完成照片（最多 3 張）</label><input type="file" id="pFile" accept="image/*" multiple>
      <div class="thumbs" id="pThumbs"></div>
      <button class="btn" id="pGo">送出回報</button></div>`;
  }
  if (mgr && r.status === '待核准') {
    action = `<div class="card"><h3>主管審核</h3>
      <label>備註（退回必填）</label><textarea id="mNote"></textarea>
      <div class="btns"><button class="btn red" id="mNo">退回</button><button class="btn" id="mYes">核准</button></div></div>`;
  }
  if (mgr && r.status === '待檢核') {
    action = `<div class="card"><h3>主管檢核</h3>
      <label>備註（退回補件必填）</label><textarea id="mNote"></textarea>
      <div class="btns"><button class="btn outline" id="cNo">退回補件</button><button class="btn" id="cYes">檢核通過</button></div></div>`;
  }

  const diff = r.diff !== '' ? ` （${r.diff > 0 ? '+' : ''}${esc(r.diff)}）` : '';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `
    <div class="bar"><button id="xBack">‹</button><b>${esc(r.id)}</b><span class="st st-${esc(r.status)}" style="margin-left:auto">${esc(r.status)}</span></div>
    <div class="wrap">
      <div class="card"><dl>
        <dt>申請人</dt><dd>${esc(r.name)}（${esc(r.dept)}）</dd>
        <dt>申請時間</dt><dd>${esc(r.createdAt)}</dd>
        <dt>需求日期</dt><dd>${esc(r.date)}</dd>
        <dt>工作項目</dt><dd>${esc(r.item)}</dd>
        <dt>工作說明</dt><dd>${esc(r.desc)}</dd>
        ${r.taskCheck
          ? `<dt>事項確認</dt><dd>${esc(r.taskCheck)}</dd>`
          : tasks.length ? `<dt>預計事項</dt><dd>${tasks.map((t, i) => `${i + 1}. ${esc(t)}`).join('\n')}</dd>` : ''}
        <dt>預估工時</dt><dd>${esc(r.people)} 人 × ${esc(r.hours)} 小時 = ${esc(r.estTotal)} 小時</dd>
        ${r.approver ? `<dt>核准</dt><dd>${esc(r.approver)}・${esc(r.approvedAt)}${r.approveNote ? '\n' + esc(r.approveNote) : ''}</dd>` : ''}
        ${r.actTotal !== '' ? `<dt>實際工時</dt><dd>${esc(r.actPeople)} 人 × ${esc(r.actHours)} 小時 = ${esc(r.actTotal)} 小時${diff}</dd>
          <dt>完成狀態</dt><dd>${esc(r.done)}${r.doneNote ? '\n' + esc(r.doneNote) : ''}</dd>` : ''}
        ${photoLinks ? `<dt>照片</dt><dd>${photoLinks}</dd>` : ''}
        ${r.checker ? `<dt>檢核</dt><dd>${esc(r.checkResult)}・${esc(r.checker)}${r.checkNote ? '\n' + esc(r.checkNote) : ''}</dd>` : ''}
      </dl></div>
      ${action}
    </div>`;
  document.body.appendChild(sheet);
  const close = () => sheet.remove();
  const done = async (msg) => { close(); toast(msg); await reload(); };
  sheet.querySelector('#xBack').onclick = close;

  const on = (sel, fn) => { const el = sheet.querySelector(sel); if (el) el.onclick = fn; };
  on('#xCancel', () => run(async () => { await api('cancel', { id: r.id }); await done('已取消申請'); }));
  on('#mYes', () => run(async () => { await api('approve', { id: r.id, decision: 'approve', note: sheet.querySelector('#mNote').value }); await done('已核准'); }));
  on('#mNo', () => run(async () => { await api('approve', { id: r.id, decision: 'reject', note: sheet.querySelector('#mNote').value }); await done('已退回'); }));
  on('#cYes', () => run(async () => { await api('check', { id: r.id, decision: 'pass', note: sheet.querySelector('#mNote').value }); await done('已檢核結案'); }));
  on('#cNo', () => run(async () => { await api('check', { id: r.id, decision: 'redo', note: sheet.querySelector('#mNote').value }); await done('已退回補件'); }));

  if (sheet.querySelector('#pGo')) {
    const calc = () => { sheet.querySelector('#pTotal').textContent = Math.round((+sheet.querySelector('#pPeople').value || 0) * (+sheet.querySelector('#pHours').value || 0) * 10) / 10; };
    sheet.querySelector('#pPeople').oninput = calc; sheet.querySelector('#pHours').oninput = calc; calc();
    const chks = Array.from(sheet.querySelectorAll('.pChk'));
    const syncChk = () => {
      const n = chks.filter((c) => c.checked).length;
      const sumEl = sheet.querySelector('#pChkSum');
      if (sumEl) sumEl.textContent = `已確認 ${n}/${chks.length} 項`;
      if (chks.length) sheet.querySelector('#pDone').value = n === chks.length ? '完成' : n === 0 ? '未完成' : '部分完成';
    };
    chks.forEach((c) => (c.onchange = syncChk));
    if (chks.length) syncChk();
    sheet.querySelector('#pFile').onchange = (e) => run(async () => {
      const files = Array.from(e.target.files).slice(0, 3);
      photos = await Promise.all(files.map(compress));
      sheet.querySelector('#pThumbs').innerHTML = photos.map((p) => `<img src="${p}">`).join('');
      if (e.target.files.length > 3) toast('最多 3 張，已取前 3 張');
    }, '處理照片…');
    on('#pGo', () => run(async () => {
      await api('report', {
        id: r.id, actPeople: +sheet.querySelector('#pPeople').value, actHours: +sheet.querySelector('#pHours').value,
        done: sheet.querySelector('#pDone').value, note: sheet.querySelector('#pNote').value, photos,
        checked: chks.map((c) => c.checked),
      });
      await done('已送出回報，等待主管檢核');
    }, '上傳中…'));
  }
}

// 壓縮照片：長邊 1280px、JPEG 品質 0.75
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => reject(new Error('照片讀取失敗'));
    img.src = url;
  });
}
</script>
</body>
</html>
